# Copy to the stable deployment directory, never add credentials to Git.
# Use with the same playback-alerts.yml and a read-only token file mount.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {site: lan, application: cinevn}
rule_files: [playback-alerts.yml]
scrape_configs:
  - job_name: cinevn
    static_configs:
      - targets: ['127.0.0.1:5001']
remote_write:
  - url: https://prometheus-prod-37-prod-ap-southeast-1.grafana.net/api/prom/push
    basic_auth:
      username: '3613090'
      password_file: /run/secrets/grafana-token
    queue_config: {max_shards: 2, capacity: 3000, max_samples_per_send: 1000}
    write_relabel_configs:
      - source_labels: [__name__]
        regex: '(playback_.*|up|process_.*|nodejs_.*|http_request_duration_seconds_.*|http_requests_total)'
        action: keep
