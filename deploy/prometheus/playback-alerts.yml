groups:
  - name: cinevn-playback
    rules:
      - alert: CineVNFirstFrameSlow
        expr: histogram_quantile(0.5, sum by (le) (rate(playback_time_to_first_frame_seconds_bucket[10m]))) > 3 and sum(increase(playback_time_to_first_frame_seconds_count[10m])) >= 10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "CineVN median first frame exceeds 3 seconds"}
      - alert: CineVNSeekSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(playback_seek_latency_seconds_bucket[10m]))) > 8 and sum(increase(playback_seek_latency_seconds_count[10m])) >= 10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "CineVN seek p95 exceeds 8 seconds"}
      - alert: CineVNPlaybackFailures
        expr: sum(increase(playback_failure_total[10m])) / clamp_min(sum(increase(playback_success_total[10m])) + sum(increase(playback_failure_total[10m])), 1) > 0.01 and sum(increase(playback_failure_total[10m])) >= 3
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "CineVN playback failure ratio exceeds 1 percent"}
      - alert: CineVNRebuffering
        expr: sum(rate(playback_rebuffer_seconds_total[10m])) / clamp_min(sum(rate(playback_played_seconds_total[10m])) + sum(rate(playback_rebuffer_seconds_total[10m])), 0.000001) > 0.03 and sum(increase(playback_played_seconds_total[10m])) > 300
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "CineVN rebuffer ratio exceeds 3 percent"}
