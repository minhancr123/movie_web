# Load in nginx http{} after movieweb.conf (which defines cinevn_client_ip).
# No query strings, OAuth codes, bearer tokens or cookies are logged.
map $uri $cinevn_audit_path {
    default $uri;
    ~^/api/playback/subtitles/vtt/ "/api/playback/subtitles/vtt/[redacted]";
}
map $uri $cinevn_is_auth {
    default 0;
    ~^/api/auth/(register|login|google-login|signin|callback)(/|$) 1;
}
log_format cinevn_safe escape=json '{"time":"$time_iso8601","ip":"$cinevn_client_ip","peer":"$remote_addr","method":"$request_method","path":"$cinevn_audit_path","status":$status,"userAgent":"$http_user_agent"}';
access_log /var/log/nginx/access.log cinevn_safe;
access_log /var/log/nginx/auth-audit.jsonl cinevn_safe if=$cinevn_is_auth;
