map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Only the locally connected tunnel can supply the original HTTPS scheme.
map "$remote_addr:$http_x_forwarded_proto" $cinevn_forwarded_proto {
    default $scheme;
    "127.0.0.1:https" https;
    "::1:https" https;
}
map $http_cf_connecting_ip $cinevn_tunnel_client {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
map $remote_addr $cinevn_client_ip {
    default $remote_addr;
    127.0.0.1 $cinevn_tunnel_client;
    ::1 $cinevn_tunnel_client;
}
server {
    listen 80;
    server_name cinevn.me www.cinevn.me;
    client_max_body_size 10M;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    include /etc/nginx/snippets/cinevn-routes.conf;
}
server {
    listen 443 ssl;
    http2 on;
    server_name cinevn.me www.cinevn.me;
    ssl_certificate /etc/letsencrypt/live/cinevn.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinevn.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10M;
    include /etc/nginx/snippets/cinevn-routes.conf;
}
