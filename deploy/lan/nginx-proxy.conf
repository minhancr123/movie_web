proxy_set_header Host $host;
proxy_set_header X-Real-IP $cinevn_client_ip;
# Overwrite the incoming chain: the backend trusts exactly this Nginx hop.
proxy_set_header X-Forwarded-For $cinevn_client_ip;
proxy_set_header X-Forwarded-Proto $cinevn_forwarded_proto;
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
