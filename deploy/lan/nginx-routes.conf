# Include inside BOTH the HTTP tunnel origin and the HTTPS server block.
# The public tunnel terminates TLS before reaching this HTTP listener.
location = /healthz {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
location = /api/health {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
location ~ ^/api/auth/(register|login|google-login|me|profile)($|/) {
    proxy_pass http://127.0.0.1:5001;
    include /etc/nginx/snippets/cinevn-proxy.conf;
}
location /api/auth/ {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/cinevn-proxy.conf;
}
location /api/playback/ {
    proxy_pass http://127.0.0.1:5001;
    proxy_buffering off;
    proxy_read_timeout 120s;
    include /etc/nginx/snippets/cinevn-proxy.conf;
}
location /api/ {
    proxy_pass http://127.0.0.1:5001;
    include /etc/nginx/snippets/cinevn-proxy.conf;
}
location /socket.io/ {
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    include /etc/nginx/snippets/cinevn-proxy.conf;
}
location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/cinevn-proxy.conf;
}
