# LAN only. Do not add this port to the public tunnel or router forwarding.
server {
    listen 8088;
    server_name _;
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.100.0/24;
    deny all;
    root /data/cinevn-check;
    index index.html;
    add_header Cache-Control "no-store" always;
    location = /remux-source.mkv { deny all; }
    location / { try_files $uri $uri/ =404; }
}
