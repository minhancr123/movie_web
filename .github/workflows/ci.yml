name: CI

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend-node/package-lock.json
            frontend/package-lock.json

      - name: Backend tests
        run: |
          npm ci --prefix backend-node
          npm test --prefix backend-node

      - name: Frontend typecheck and tests
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_SITE_URL }}/api
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.PUBLIC_SITE_URL }}/api
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Manifest tests
        run: python -m unittest discover -s deploy/tests -v
