name: CI

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend-node/package-lock.json
            frontend/package-lock.json

      - name: Backend tests
        run: |
          npm ci --prefix backend-node
          npm test --prefix backend-node

      - name: Frontend typecheck and tests
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_SITE_URL }}/api
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.PUBLIC_SITE_URL }}/api
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Manifest tests
        run: python -m unittest discover -s deploy/tests -v
