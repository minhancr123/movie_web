name: Deploy to VPS

on:
  push:
    # feat/torbox-playback-cinema IS the release line: everything in
    # production deploys from it, main is stale. Wiring only main here is how
    # every deploy ended up being done by hand over SSH.
    branches: [main, master, feat/torbox-playback-cinema]
    paths:
      - 'backend-node/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
      # Docs-only changes (e.g. backend-node/README.md) must not burn a
      # build+deploy: '!' exclusions are honored inside paths filters.
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: cineon-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend-node/package-lock.json
            frontend/package-lock.json

      - name: Backend tests
        run: |
          npm ci --prefix backend-node
          npm test --prefix backend-node

      - name: Frontend typecheck and tests
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend
        env:
          RELEASE_ID: ${{ github.sha }}
          # NEXT_PUBLIC_* is baked into the client bundle at build time.
          # Without these the sitemap falls back to a dead hostname.
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_SITE_URL }}/api
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.PUBLIC_SITE_URL }}/api
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Manifest tests
        run: python -m unittest discover -s deploy/tests -v

  docker:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Without this the GHCR push fails with
      # "denied: installation not allowed to Create organization package".
      packages: write
      # type=gha layer cache reads/writes via the Actions cache service.
      actions: write
    outputs:
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: build_backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend-node
          file: ./backend-node/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/movie-web-backend:${{ github.sha }}
          # Scopes keep the two images from overwriting each other's cache.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        id: build_frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_SITE_URL }}/api
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.PUBLIC_SITE_URL }}/api
            NEXT_PUBLIC_SOCKET_URL=${{ vars.PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}
            RELEASE_ID=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/movie-web-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  security:
    name: Security Scan
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # Advisory only: base-image CVEs (node:slim) fail often and there is no
    # security team to triage, so a finding must never block a deploy.
    continue-on-error: true
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/movie-web-backend@${{ needs.docker.outputs.backend_digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/movie-web-frontend@${{ needs.docker.outputs.frontend_digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  deploy:
    name: Deploy
    needs: [docker, security]
    # security is advisory (continue-on-error: findings resolve to success, so
    # only docker gates the deploy). !cancelled(): a run cancelled during the
    # scan window must never roll forward — always() would let it deploy.
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: 'Production Environments'

    steps:
      - name: Roll out
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799 # v1.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: '20m'
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/cineon

            SHA="${{ github.sha }}"
            BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/movie-web-backend@${{ needs.docker.outputs.backend_digest }}
            FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/movie-web-frontend@${{ needs.docker.outputs.frontend_digest }}

            git fetch --quiet origin
            # A file copied onto the host by hand (a new script installed before
            # it was committed) blocks the checkout, and the deploy dies with
            # "untracked working tree files would be overwritten" before it can
            # replace them. On a deploy host the tree carries no local edits by
            # design, so the retry is safe: -f overwrites exactly the paths that
            # are in the target commit and nothing else. .env is gitignored, so
            # it is never in that set. The error goes to the log first — what
            # got overwritten should never be invisible.
            if ! err=$(git checkout --quiet "$SHA" 2>&1); then
              echo "::warning::checkout had to overwrite local files:"
              printf '%s\n' "$err" | sed 's/^/  /'
              git checkout --quiet -f "$SHA"
            fi
            GOT=$(git rev-parse HEAD)
            [ "$GOT" = "$SHA" ] || { echo "checked out $GOT, expected $SHA"; exit 1; }

            # Pulling two images needs gigabytes of headroom, and a pull
            # that runs out mid-layer leaves the daemon in a worse state than
            # refusing early. Prune first if the box is already warm; refuse if
            # it is still too full afterwards.
            USEP=$(df --output=pcent / | tail -1 | tr -d ' %')
            if [ "$USEP" -ge 85 ]; then
              echo "disk at ${USEP}% — pruning before pull"
              docker builder prune -af >/dev/null 2>&1 || true
              docker image prune -af >/dev/null 2>&1 || true
              USEP=$(df --output=pcent / | tail -1 | tr -d ' %')
            fi
            [ "$USEP" -lt 92 ] || { echo "::error::disk still at ${USEP}% after prune — refusing to pull"; exit 1; }

            # Rollback targets are image IDs, not tags: tags move, IDs do not.
            PREV_BACKEND=$(docker inspect -f '{{.Image}}' cineon-backend 2>/dev/null || true)
            PREV_FRONTEND=$(docker inspect -f '{{.Image}}' cineon-frontend 2>/dev/null || true)
            echo "Current images: backend=${PREV_BACKEND:-none} frontend=${PREV_FRONTEND:-none}"

            rollback() {
              echo "ROLLING BACK"
              [ -n "${PREV_BACKEND:-}" ] && [ -n "${PREV_FRONTEND:-}" ] || {
                echo "::error::No previous images to fall back to - the site is down"
                exit 1
              }
              # The running containers report RELEASE_ID, so a rollback that
              # keeps the failed SHA makes /release lie about what is live.
              # .env still holds the previous release: it is only rewritten
              # on success, below.
              ROLLBACK_RELEASE=$(grep -E '^RELEASE_ID=' .env 2>/dev/null | cut -d= -f2 || true)
              [ -n "${ROLLBACK_RELEASE:-}" ] || ROLLBACK_RELEASE="$SHA"
              # All node services share BACKEND_IMAGE: a scoped restart would
              # leave the worker and scheduler on the failed image.
              BACKEND_IMAGE="$PREV_BACKEND" FRONTEND_IMAGE="$PREV_FRONTEND" RELEASE_ID="$ROLLBACK_RELEASE" \
                docker compose -f docker-compose.prod.yml up -d
              for i in $(seq 1 12); do
                if curl -fsS http://localhost:5001/healthz >/dev/null; then
                  echo "::error::Deploy failed; rolled back to the previous images"
                  exit 1
                fi
                sleep 5
              done
              echo "::error::Deploy failed AND rollback did not come up"
              exit 1
            }

            # Private GHCR packages need a login; public ones do not. The
            # secret may be absent entirely, in which case this is a no-op.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            fi

            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            export BACKEND_IMAGE FRONTEND_IMAGE RELEASE_ID="$SHA"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for the stack to report healthy..."
            wait_for() {
              local url=$1
              local tries=$2
              local i
              for i in $(seq 1 "$tries"); do
                if curl -fsS --max-time 15 "$url" >/dev/null; then
                  echo "ok  $url (${i})"
                  return 0
                fi
                sleep 5
              done
              echo "FAILED  $url"
              return 1
            }
            wait_for http://localhost:5001/healthz 24 || {
              echo "API never became healthy"
              docker compose -f docker-compose.prod.yml logs --tail 200 backend-node || true
              rollback
            }

            docker exec cineon-backend ffmpeg -version >/dev/null \
              || { echo "::error::ffmpeg missing"; rollback; }
            # The frontend needs tens of seconds to boot on this box. A single
            # shot right after the backend turns healthy only proves it is
            # still starting — this exact check once rolled a good deploy back.
            wait_for http://localhost:3000/api/health 18 \
              || { echo "::error::frontend is not responding"; rollback; }
            wait_for https://cinevn.me/ 12 \
              || { echo "::error::public site is not responding"; rollback; }

            # Health alone proves nothing about which image is live: the old
            # container passes every one of those probes. Assert identity, then
            # ask the app which commit it thinks it is.
            for pair in "cineon-backend:$BACKEND_IMAGE" "cineon-frontend:$FRONTEND_IMAGE"; do
              c=${pair%%:*}; want=${pair#*:}
              got=$(docker inspect -f '{{.Config.Image}}' "$c" 2>/dev/null)
              if [ "$got" = "$want" ]; then
                echo "identity ok  $c -> $got"
              else
                echo "::error::MISMATCH $c runs $got, wanted $want"
                rollback
              fi
            done
            RELEASE_JSON=$(curl -fsS --max-time 15 https://cinevn.me/release) \
              || { echo "::error::/release did not answer"; rollback; }
            echo "$RELEASE_JSON" | grep -q "$SHA" \
              || { echo "::error::release mismatch: $RELEASE_JSON"; rollback; }
            echo "release ok  $RELEASE_JSON"

            # Persist what is actually running, then reclaim the build layers: a
            # dozen of them once filled this 30 GB disk.
            #
            # .env must name the live images, not whatever the last manual
            # deploy put there. compose requires BACKEND_IMAGE/FRONTEND_IMAGE,
            # and a stale pin makes EVERY later `docker compose` invocation fail
            # with "image not found" — which is how a routine restart, a manual
            # config change, or a rollback got bricked: the pin pointed at an
            # image that had since been pruned.
            set_env() {
              local key=$1 value=$2
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            set_env RELEASE_ID "$SHA"
            set_env BACKEND_IMAGE "$BACKEND_IMAGE"
            set_env FRONTEND_IMAGE "$FRONTEND_IMAGE"
            # prune -a, not just -f: every deploy pulls a new digest image and
            # the old ones keep their layers but lose all consumers, which
            # plain prune (dangling only) never reclaims. Measured at 15GB of
            # dead images after a week of CI deploys. Runs only on the success
            # path, after rollback targets are no longer needed — which is why
            # .env is written first: the images it now names are the live ones.
            docker builder prune -af >/dev/null 2>&1 || true
            docker image prune -af >/dev/null 2>&1 || true
            df -h / | tail -1

            echo "DEPLOY_OK $SHA"

      - name: Smoke tests
        # Runs from the runner against the public origin, after the SSH script
        # already asserted identity + /release. Covers the two runtime layers
        # health probes miss: a sitemap baked with the wrong site URL, and a
        # dead catalog path. Deliberately light: no resolve/playback calls, and
        # no auto-rollback here — the script above already pruned the previous
        # images, so a failure here just turns the run red for a human to act.
        run: |
          set -euo pipefail
          SITE="${{ vars.PUBLIC_SITE_URL }}"
          HOST=$(echo "$SITE" | sed 's#^https\?://##; s#/$##')
          # grep -q quits on first match and closes the pipe: with pipefail a
          # big-enough sitemap makes curl die of SIGPIPE and the step reds for
          # no reason. Download first, then grep the file.
          curl -fsS --max-time 30 -o /tmp/smoke-sitemap.xml "$SITE/sitemap.xml" \
            || { echo "::error::sitemap did not answer"; exit 1; }
          grep -q "$HOST" /tmp/smoke-sitemap.xml \
            || { echo "::error::sitemap does not contain the public domain ($HOST)"; exit 1; }
          echo "sitemap ok"
          curl -fsS --max-time 30 "$SITE/api/catalog/genres/movie" \
            | jq -e '.success == true and (.data.genres | length > 0)' >/dev/null \
            || { echo "::error::catalog API did not return genres"; exit 1; }
          echo "catalog ok"
          echo "SMOKE_OK"
