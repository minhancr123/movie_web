name: Deploy to VPS

on:
  push:
    branches: [main, master]
    paths:
      - 'backend-node/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: cineon-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Backend tests
        run: |
          npm ci --prefix backend-node
          npm test --prefix backend-node

      - name: Frontend typecheck and tests
        run: |
          npm ci --prefix frontend
          npx tsc --noEmit --prefix frontend
          npm test --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend
        env:
          RELEASE_ID: ${{ github.sha }}

      - name: Manifest tests
        run: python -m unittest discover -s deploy/tests -v

  docker:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: build_backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend-node
          file: ./backend-node/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/movie-web-backend:${{ github.sha }}

      - name: Build and push frontend
        id: build_frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_SITE_URL }}/api
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.PUBLIC_SITE_URL }}/api
            NEXT_PUBLIC_SOCKET_URL=${{ vars.PUBLIC_SITE_URL }}
            RELEASE_ID=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/movie-web-frontend:${{ github.sha }}

  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: 'Production Environments'

    steps:
      - name: Roll out
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: '20m'
          script: |
            set -euo pipefail
            cd /opt/cineon

            git fetch --quiet origin
            git checkout --quiet ${{ github.sha }}

            PREV_IMAGE=$(docker inspect -f '{{.Image}}' cineon-backend 2>/dev/null || true)
            echo "Current image: ${PREV_IMAGE:-none}"

            export BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/movie-web-backend@${{ needs.docker.outputs.backend_digest }}
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/movie-web-frontend@${{ needs.docker.outputs.frontend_digest }}

            docker pull $BACKEND_IMAGE
            docker pull $FRONTEND_IMAGE

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for the API to report healthy..."
            for i in $(seq 1 24); do
              if curl -fsS http://localhost:5001/healthz >/dev/null; then
                echo "healthy after ${i} attempt(s)"
                docker exec cineon-backend ffmpeg -version >/dev/null \
                  || { echo "::error::ffmpeg missing"; exit 1; }
                curl -fsS http://localhost:3000/api/health >/dev/null || { echo "::error::frontend is not responding"; exit 1; }
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 5
            done

            echo "API never became healthy"
            docker compose -f docker-compose.prod.yml logs --tail 200 backend-node || true

            if [ -z "${PREV_IMAGE:-}" ]; then
              echo "::error::No previous image to fall back to - the site is down"
              exit 1
            fi

            echo "Rolling back to ${PREV_IMAGE}"
            export BACKEND_IMAGE=$PREV_IMAGE
            docker compose -f docker-compose.prod.yml up -d --no-deps backend-node frontend

            for i in $(seq 1 12); do
              if curl -fsS http://localhost:5001/healthz >/dev/null; then
                echo "::error::Deploy failed; rolled back to the previous image"
                exit 1
              fi
              sleep 5
            done

            echo "::error::Deploy failed AND rollback did not come up"
            exit 1
