version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - minhancr123
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /backend-node
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    reviewers:
      - minhancr123
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 10
    reviewers:
      - minhancr123
    labels:
      - dependencies
      - frontend
