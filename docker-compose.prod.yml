services:

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: movieweb-redis
    restart: unless-stopped
    # ports:
    #   - "6379:6379" # Removed for security. Access internally via Docker network.
    volumes:
      - redis-data-new:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - movieweb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3


  # Node.js Backend (Auth, Comments, Socket.io)
  backend-node:
    image: minhancr123/movie-web:node-latest
    container_name: movieweb-backend-node
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=30d
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
      # --- Catalog ---
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_READ_TOKEN=${TMDB_READ_TOKEN}
      # --- Playback sources ---
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - TOKEN_ENCRYPTION_KEYS=${TOKEN_ENCRYPTION_KEYS}
      - STREMIO_ADDONS=${STREMIO_ADDONS}
      - STREMIO_SUBTITLE_ADDONS=${STREMIO_SUBTITLE_ADDONS}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      # --- Transcode pipeline ---
      # Must point at the mounted volume below, or renditions land in the
      # container's own layer: lost on every restart and filling the overlay
      # until Docker itself runs out of room.
      - TRANSCODE_ROOT=/data/transcodes
      - TRANSCODE_CACHE_MAX_GB=${TRANSCODE_CACHE_MAX_GB:-60}
      - RENDITIONS_MAX_GB=${RENDITIONS_MAX_GB:-60}
      # CPU-only box: one 4K HEVC->AVC transcode costs ~54s of CPU per 60s of
      # video, so two viewers on an undecodable release would stall everyone.
      - VIDEO_TRANSCODE_FALLBACK=${VIDEO_TRANSCODE_FALLBACK:-never}
      # Ceiling on NEW writers. Joining a running session, or watching a
      # finished rendition, costs no slot.
      - REMUX_MAX_WRITERS=${REMUX_MAX_WRITERS:-3}
      # Behind Caddy/nginx. Wrong here and every viewer shares one rate limit.
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - transcodes:/data/transcodes
    networks:
      - movieweb-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend-node-worker:
    image: minhancr123/movie-web:node-latest
    container_name: movieweb-backend-node-worker
    restart: unless-stopped
    command: ["node", "workers/queueWorker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - movieweb-network

  backend-node-scheduler:
    image: minhancr123/movie-web:node-latest
    container_name: movieweb-backend-node-scheduler
    restart: unless-stopped
    command: ["node", "workers/scheduler.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - movieweb-network

volumes:
  redis-data-new:
    driver: local
  # Renditions are large and worth keeping across restarts: a film already
  # remuxed plays instantly and seeks anywhere, instead of rebuilding.
  transcodes:
    driver: local

networks:
  movieweb-network:
    driver: bridge
