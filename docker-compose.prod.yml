# ── Cineon Production Compose ──
# Resource contract: 1 vCPU, 4 GB RAM, 30 GB NVMe
# All host ports bind to 127.0.0.1 — Caddy handles external TLS.

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:

  # Redis Cache — append-only, no eviction (queue data must survive)
  redis:
    image: redis:7-alpine
    container_name: cineon-redis
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 64
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - ${REDIS_VOLUME:-cineon-redis}:/data
    networks:
      - cineon
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Node.js Backend (API + Socket.IO + remux)
  backend-node:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}
    container_name: cineon-backend
    restart: unless-stopped
    mem_limit: 1280m
    pids_limit: 256
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - RELEASE_ID=${RELEASE_ID:?RELEASE_ID required}
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI required}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-movieweb}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - JWT_EXPIRE=30d
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
      # --- Catalog ---
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_READ_TOKEN=${TMDB_READ_TOKEN}
      - TMDB_BASE_URL=${TMDB_BASE_URL:-}
      - TMDB_PROXY_TOKEN=${TMDB_PROXY_TOKEN:-}
      - VIMO_ENABLED=${VIMO_ENABLED:-}
      - VIMO_ADDON_URL=${VIMO_ADDON_URL:-}
      - CATALOG_PROVIDER=${CATALOG_PROVIDER:-tmdb}
      - PLAYBACK_PROVIDER=${PLAYBACK_PROVIDER:-debrid}
      # --- Playback sources ---
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - TORBOX_BASE_URL=${TORBOX_BASE_URL:-}
      - TOKEN_ENCRYPTION_KEYS=${TOKEN_ENCRYPTION_KEYS:?TOKEN_ENCRYPTION_KEYS required}
      - STREMIO_ADDONS=${STREMIO_ADDONS}
      - STREMIO_SUBTITLE_ADDONS=${STREMIO_SUBTITLE_ADDONS}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - OPENSUBTITLES_USER_AGENT=${OPENSUBTITLES_USER_AGENT:-MovieWeb/1.0}
      # --- Transcode pipeline ---
      - TRANSCODE_ROOT=/data/transcodes
      - TRANSCODE_CACHE_MAX_GB=${TRANSCODE_CACHE_MAX_GB:-3}
      - RENDITIONS_MAX_GB=${RENDITIONS_MAX_GB:-3}
      - VIDEO_TRANSCODE_FALLBACK=${VIDEO_TRANSCODE_FALLBACK:-never}
      - REMUX_MAX_WRITERS=${REMUX_MAX_WRITERS:-1}
      # Behind Caddy. Wrong here and every viewer shares one rate limit.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # --- Media CDN ---
      - PUBLIC_MEDIA_BASE_URL=${PUBLIC_MEDIA_BASE_URL:-}
      # --- Node runtime ---
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - ${TRANSCODES_VOLUME:-cineon-transcodes}:/data/transcodes
    networks:
      - cineon
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Next.js frontend (standalone, served by its own Node process)
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE required}
    container_name: cineon-frontend
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 64
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - RELEASE_ID=${RELEASE_ID}
      # Server renders talk to the API over the private network
      - INTERNAL_API_URL=http://backend-node:5001/api
      - NODE_OPTIONS=--max-old-space-size=512
      - NEXTAUTH_URL=${FRONTEND_URL:-https://cineon.me}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    networks:
      - cineon
    depends_on:
      backend-node:
        condition: service_healthy
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  # BullMQ worker (async jobs: subtitle extraction, analytics aggregation)
  backend-node-worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}
    container_name: cineon-worker
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 30s
    command: ["node", "--max-old-space-size=192", "workers/queueWorker.js"]
    environment:
      - NODE_ENV=production
      - RELEASE_ID=${RELEASE_ID}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cineon
    logging: *logging

  # BullMQ scheduler (repeatable jobs: cache cleanup, analytics rollup)
  backend-node-scheduler:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}
    container_name: cineon-scheduler
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 32
    stop_grace_period: 15s
    command: ["node", "--max-old-space-size=128", "workers/scheduler.js"]
    environment:
      - NODE_ENV=production
      - RELEASE_ID=${RELEASE_ID}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cineon
    logging: *logging

volumes:
  cineon-redis:
    driver: local
  # Renditions are large and worth keeping across restarts: a film already
  # remuxed plays instantly and seeks anywhere, instead of rebuilding.
  cineon-transcodes:
    driver: local

networks:
  cineon:
    driver: bridge
