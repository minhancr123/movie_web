services:

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: movieweb-redis
    restart: unless-stopped
    # ports:
    #   - "6379:6379" # Removed for security. Access internally via Docker network.
    volumes:
      - redis-data-new:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - movieweb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3


  # Node.js Backend (Auth, Comments, Socket.io)
  backend-node:
    image: minhancr123/movie-web:node-latest
    container_name: movieweb-backend-node
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=30d
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
    networks:
      - movieweb-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend-node-worker:
    image: minhancr123/movie-web:node-latest
    container_name: movieweb-backend-node-worker
    restart: unless-stopped
    command: ["node", "workers/queueWorker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - movieweb-network

  backend-node-scheduler:
    image: minhancr123/movie-web:node-latest
    container_name: movieweb-backend-node-scheduler
    restart: unless-stopped
    command: ["node", "workers/scheduler.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - JOB_QUEUE_NAME=movieweb-jobs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - movieweb-network

volumes:
  redis-data-new:
    driver: local

networks:
  movieweb-network:
    driver: bridge
