<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — CineVN</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        gap: 1rem;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .badge {
        font: 700 4rem/1 system-ui, sans-serif;
        color: #f59e0b;
        letter-spacing: -0.06em;
      }
      h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
      p { margin: 0 0 1.25rem; color: #a3a3a3; font-size: 0.9rem; max-width: 30ch; }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 9999px;
        background: #f59e0b;
        color: #0a0a0a;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="badge">4<span style="font-size: 2rem">0</span>4</div>
      <h1>Mất kết nối</h1>
      <p>
        Không có mạng để tải trang này. Video đã tải vẫn xem được; phần còn lại cần mạng
        để tải nguồn phát.
      </p>
      <a href="/">Thử lại</a>
    </div>
  </body>
</html>
